<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Search multiple UK job sources from one place."><title>Job Hunter</title><link rel="stylesheet" href="styles.css"></head><body><header><a class="brand" href="./">JOB HUNTER</a><span>Multi-board job search</span></header><main><section class="hero"><p class="eyebrow">SEARCH ONCE. CHECK EVERYWHERE.</p><h1>Find the job. Skip the tab hell.</h1><form id="searchForm"><div class="grid"><label class="wide">Job title, skill or keyword<input id="q" name="q" required maxlength="120" autocomplete="off" placeholder="e.g. Intune Engineer, Video Editor, Chef"></label><label>Location<input id="location" name="location" maxlength="100" placeholder="e.g. London, Manchester"></label><label>Minimum salary<input id="salaryMin" name="salaryMin" type="number" min="0" max="1000000" step="1000" placeholder="45000"></label><label>Posted within<select id="days"><option value="">Any time</option><option value="1">24 hours</option><option value="3">3 days</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option></select></label><label>Results per source<select id="limit"><option>10</option><option selected>20</option><option>50</option></select></label></div><fieldset><legend>Sources</legend><label><input type="checkbox" name="source" value="reed" checked> Reed</label><label><input type="checkbox" name="source" value="adzuna" checked> Adzuna</label><label><input type="checkbox" name="source" value="cvlib"> CV-Library</label></fieldset><button id="searchBtn" type="submit">Search jobs</button></form></section><section class="results"><div class="resultsHead"><div><h2 id="resultsTitle">Results</h2><p id="status">Enter any role, skill or keyword above.</p></div><select id="sort" aria-label="Sort results"><option value="newest">Newest</option><option value="salary">Highest salary</option><option value="title">Job title</option></select></div><div id="error" class="error" hidden></div><div id="jobs"></div></section></main><footer>Job Hunter searches configured third-party job APIs. Always verify vacancy details on the source site.</footer><script src="config.js"></script><script src="app.js"></script></body></html>
